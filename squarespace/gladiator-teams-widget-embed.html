<section class="pb-glad" data-pb-glad>
  <style>
    .pb-glad{--y:#f6c62f;--ink:#111;max-width:1120px;margin:0 auto;padding:12px 14px;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink)}
    .pb-glad *{box-sizing:border-box}
    .pb-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
    .pb-title{margin:0;font-size:clamp(1.05rem,2vw,1.5rem);font-weight:800}
    .pb-status{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.78}
    .pb-controls{margin-bottom:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
    .pb-actions,.pb-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
    .pb-btn{border:0;border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.08);font-size:.75rem;font-weight:800;text-transform:uppercase;cursor:pointer}
    .pb-actions .pb-btn{flex:1 1 118px;min-width:0;text-align:center}
    .pb-btn:hover{background:rgba(0,0,0,.16)}
    .pb-btn.go{background:var(--y)}
    .pb-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:rgba(0,0,0,.08);font-size:.68rem;font-weight:800;text-transform:uppercase}
    .pb-chip select{border:0;background:transparent;font-weight:800;outline:none}
    .pb-picks{max-height:210px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
    .pb-pick{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-template-areas:"cb av name" "cb team class";align-items:center;column-gap:8px;row-gap:6px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:visible}
    .pb-pick input[type="checkbox"]{grid-area:cb;margin:0}
    .pb-pick img{width:24px;height:24px;border-radius:999px;object-fit:contain;background:#fff;border:1px solid rgba(0,0,0,.14);padding:2px}
    .pb-pick img{grid-area:av}
    .pb-name{grid-area:name;font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pb-team,.pb-class{border:0;border-radius:999px;padding:4px 8px;background:rgba(0,0,0,.08);font-size:.68rem;font-weight:800;outline:none;min-width:0;width:100%}
    .pb-team{grid-area:team}
    .pb-class{grid-area:class}
    .pb-bench{position:absolute;left:8px;right:8px;top:calc(100% + 4px);display:none;padding:6px 7px;border-radius:8px;background:rgba(255,255,255,.96);box-shadow:0 8px 16px rgba(0,0,0,.14),inset 0 0 0 1px rgba(0,0,0,.08);z-index:40;pointer-events:none}
    .pb-pick:hover .pb-bench,.pb-pick:focus-within .pb-bench{display:block}
    .pb-bh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;font-size:.6rem;font-weight:900;text-transform:uppercase}
    .pb-bh span{opacity:.7;letter-spacing:.04em}
    .pb-bh strong{font-size:.64rem;letter-spacing:.03em}
    .pb-brows{display:grid;gap:3px}
    .pb-br{display:grid;grid-template-columns:56px minmax(0,1fr) 32px 34px;align-items:center;gap:5px;font-size:.6rem;font-weight:800}
    .pb-br em,.pb-br small{font-style:normal;text-align:right}
    .pb-br small{opacity:.68}
    .pb-bar{position:relative;height:7px;border-radius:999px;background:rgba(0,0,0,.12);overflow:hidden}
    .pb-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f6c62f,#ffd76f)}
    .pb-bar b{position:absolute;top:0;bottom:0;left:var(--bm,50%);width:2px;background:rgba(17,17,17,.55);transform:translateX(-1px)}
    .pb-hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
    .pb-cell{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);font-size:.72rem;font-weight:800;text-transform:uppercase}
    .pb-stage{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px}
    .pb-arena{position:relative;width:100%;aspect-ratio:2.2/1;min-height:290px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(246,198,47,.14),rgba(246,198,47,0) 42%),linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.08)}
    .pb-arena.sudden{box-shadow:inset 0 0 0 2px rgba(246,198,47,.55),0 12px 28px rgba(0,0,0,.08)}
    .pb-ring{position:absolute;border-radius:999px;pointer-events:none;border:2px solid rgba(246,198,47,.4);inset:8% 6%}
    .pb-ring.r2{inset:14% 11%;border-color:rgba(246,198,47,.28)}
    .pb-divider{position:absolute;top:8%;bottom:8%;left:50%;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,rgba(246,198,47,.45) 0 12px,rgba(246,198,47,.08) 12px 24px)}
    .pb-f{position:absolute;width:var(--s,42px);height:var(--s,42px);margin-left:calc(var(--s,42px)*-.5);margin-top:calc(var(--s,42px)*-.5);z-index:3;will-change:transform;pointer-events:none}
    .pb-f.hit{filter:brightness(1.35)}
    .pb-f.dead{opacity:.42;filter:grayscale(1) contrast(.8);z-index:1}
    .pb-f.guard .pb-token{box-shadow:0 0 0 2px rgba(255,255,255,.52),0 5px 10px rgba(0,0,0,.22)}
    .pb-f.atk .pb-token{animation:pbatk .16s ease-out}
    .pb-f.cast .pb-token{animation:pbcast .28s ease-out}
    .pb-f.slam .pb-token{animation:pbslam .22s ease-out}
    .pb-f.dash .pb-token{animation:pbdash .2s ease-out}
    .pb-f.lunge .pb-token{animation:pblunge .2s ease-out}
    .pb-f.spin .pb-token{animation:pbspin .24s ease-out}
    .pb-f.shoot .pb-token{animation:pbshoot .2s ease-out}
    .pb-f.chant .pb-token{animation:pbchant .28s ease-out}
    .pb-token{position:relative;width:100%;height:100%;border-radius:999px;background:#fff;border:2px solid var(--t,#111);box-shadow:0 5px 10px rgba(0,0,0,.22);overflow:hidden;transform-origin:center center}
    .pb-swordfx{position:absolute;left:0;top:0;width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,#3f3f3f,#d8d8d8,#fff);transform-origin:2px 50%;opacity:0;pointer-events:none;z-index:42;will-change:transform,opacity;--sa:0deg}
    .pb-swordfx::before{content:"";position:absolute;left:-4px;top:-2px;width:4px;height:7px;border-radius:2px;background:#936721}
    .pb-swordfx::after{content:"";position:absolute;left:-2px;top:1px;width:2px;height:3px;background:#1f1f1f}
    .pb-swordfx.go{animation:pbswing .24s ease-out}
    .pb-token img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
    .pb-hp{position:absolute;left:50%;bottom:-7px;width:42px;height:5px;transform:translateX(-50%);border-radius:999px;background:rgba(0,0,0,.2);overflow:hidden}
    .pb-hp span{display:block;width:100%;height:100%;background:var(--y);transform-origin:left center;transition:transform .11s linear}
    .pb-vfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:34}
    .pb-trail{position:absolute;height:3px;transform-origin:left center;border-radius:999px;opacity:0}
    .pb-trail.slash{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(246,198,47,.95),rgba(255,255,255,.05));animation:pbtrail .2s ease-out forwards}
    .pb-trail.arcane{height:4px;background:linear-gradient(90deg,rgba(129,200,255,.06),rgba(129,200,255,.98),rgba(255,255,255,.1));box-shadow:0 0 10px rgba(129,200,255,.75);animation:pbtrail .28s ease-out forwards}
    .pb-trail.fire{height:4px;background:linear-gradient(90deg,rgba(255,157,60,.05),rgba(255,95,38,.98),rgba(255,208,92,.1));box-shadow:0 0 10px rgba(255,102,54,.72);animation:pbtrail .25s ease-out forwards}
    .pb-trail.frost{height:4px;background:linear-gradient(90deg,rgba(198,244,255,.05),rgba(125,225,255,.98),rgba(217,252,255,.12));box-shadow:0 0 10px rgba(125,225,255,.68);animation:pbtrail .24s ease-out forwards}
    .pb-trail.lightning{height:3px;background:linear-gradient(90deg,rgba(255,245,183,.03),rgba(255,236,74,.98),rgba(255,255,255,.2));box-shadow:0 0 12px rgba(255,230,64,.74);animation:pbtrail .16s ease-out forwards}
    .pb-trail.poison{height:4px;background:linear-gradient(90deg,rgba(150,255,143,.04),rgba(70,217,121,.96),rgba(205,255,181,.1));box-shadow:0 0 10px rgba(70,217,121,.68);animation:pbtrail .24s ease-out forwards}
    .pb-trail.holy{height:4px;background:linear-gradient(90deg,rgba(255,255,230,.05),rgba(255,233,133,.98),rgba(255,255,255,.16));box-shadow:0 0 12px rgba(255,233,133,.74);animation:pbtrail .24s ease-out forwards}
    .pb-trail.shadow{height:4px;background:linear-gradient(90deg,rgba(88,76,124,.05),rgba(111,90,178,.96),rgba(191,174,255,.12));box-shadow:0 0 10px rgba(130,108,203,.62);animation:pbtrail .24s ease-out forwards}
    .pb-trail.nature{height:4px;background:linear-gradient(90deg,rgba(115,188,83,.04),rgba(117,210,92,.96),rgba(212,255,177,.1));box-shadow:0 0 10px rgba(117,210,92,.66);animation:pbtrail .24s ease-out forwards}
    .pb-trail.sonic{height:3px;background:linear-gradient(90deg,rgba(255,151,201,.04),rgba(255,99,181,.96),rgba(255,228,244,.14));box-shadow:0 0 10px rgba(255,99,181,.66);animation:pbtrail .18s ease-out forwards}
    .pb-burst{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:999px;opacity:0}
    .pb-burst.hit{background:radial-gradient(circle,rgba(255,255,255,.95),rgba(246,198,47,.25) 54%,rgba(246,198,47,0) 78%);animation:pbburst .22s ease-out forwards}
    .pb-burst.shock{border:2px solid rgba(246,198,47,.7);background:rgba(246,198,47,.2);animation:pbshock .34s ease-out forwards}
    .pb-burst.arcane{border:2px solid rgba(129,200,255,.82);background:rgba(129,200,255,.18);box-shadow:0 0 14px rgba(129,200,255,.7);animation:pbshock .4s ease-out forwards}
    .pb-burst.heal{border:2px solid rgba(83,219,112,.92);background:radial-gradient(circle,rgba(206,255,214,.95),rgba(83,219,112,.28) 55%,rgba(83,219,112,0) 80%);box-shadow:0 0 14px rgba(83,219,112,.8);animation:pbhealburst .42s ease-out forwards}
    .pb-burst.fire{border:2px solid rgba(255,122,62,.88);background:radial-gradient(circle,rgba(255,236,180,.95),rgba(255,122,62,.28) 56%,rgba(255,122,62,0) 82%);box-shadow:0 0 14px rgba(255,122,62,.75);animation:pbshock .36s ease-out forwards}
    .pb-burst.frost{border:2px solid rgba(125,225,255,.88);background:radial-gradient(circle,rgba(226,253,255,.95),rgba(125,225,255,.25) 56%,rgba(125,225,255,0) 82%);box-shadow:0 0 14px rgba(125,225,255,.72);animation:pbshock .38s ease-out forwards}
    .pb-burst.lightning{border:2px solid rgba(255,234,94,.9);background:radial-gradient(circle,rgba(255,255,210,.95),rgba(255,234,94,.26) 56%,rgba(255,234,94,0) 82%);box-shadow:0 0 15px rgba(255,234,94,.8);animation:pbshock .28s ease-out forwards}
    .pb-burst.poison{border:2px solid rgba(71,214,120,.88);background:radial-gradient(circle,rgba(217,255,221,.95),rgba(71,214,120,.26) 56%,rgba(71,214,120,0) 82%);box-shadow:0 0 14px rgba(71,214,120,.74);animation:pbshock .38s ease-out forwards}
    .pb-burst.holy{border:2px solid rgba(255,233,133,.9);background:radial-gradient(circle,rgba(255,255,233,.96),rgba(255,233,133,.24) 56%,rgba(255,233,133,0) 82%);box-shadow:0 0 15px rgba(255,233,133,.76);animation:pbshock .4s ease-out forwards}
    .pb-burst.shadow{border:2px solid rgba(130,108,203,.86);background:radial-gradient(circle,rgba(235,226,255,.9),rgba(130,108,203,.22) 56%,rgba(130,108,203,0) 82%);box-shadow:0 0 14px rgba(130,108,203,.62);animation:pbshock .4s ease-out forwards}
    .pb-burst.nature{border:2px solid rgba(117,210,92,.88);background:radial-gradient(circle,rgba(231,255,219,.95),rgba(117,210,92,.24) 56%,rgba(117,210,92,0) 82%);box-shadow:0 0 14px rgba(117,210,92,.7);animation:pbshock .4s ease-out forwards}
    .pb-burst.sonic{border:2px solid rgba(255,109,189,.86);background:radial-gradient(circle,rgba(255,224,243,.95),rgba(255,109,189,.22) 56%,rgba(255,109,189,0) 82%);box-shadow:0 0 14px rgba(255,109,189,.66);animation:pbshock .32s ease-out forwards}
    .pb-heal-p{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:999px;background:radial-gradient(circle,#c7ffd3 0 35%,#53db70 75%);opacity:0;pointer-events:none;z-index:44;will-change:transform,opacity;animation:pbhealp .55s ease-out forwards;--hx:0px;--hy:0px}
    .pb-firefx{position:absolute;left:0;top:0;font-size:15px;line-height:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:46;will-change:transform,opacity;animation:pbfirefx .46s ease-out forwards;--fx:0px;--fy:0px}
    .pb-feed{border-radius:14px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden;min-height:290px;height:clamp(260px,42vh,420px);max-height:420px}
    .pb-feed h4{margin:0;padding:9px 10px;font-size:.72rem;font-weight:900;text-transform:uppercase;border-bottom:1px solid rgba(0,0,0,.08);opacity:.82}
    .pb-log{margin:0;padding:8px 10px;list-style:none;overflow-y:auto;overflow-x:hidden;display:grid;gap:6px;flex:1 1 auto;min-height:0;align-content:start;scrollbar-gutter:stable;overscroll-behavior:contain}
    .pb-log li{padding:6px 7px;border-radius:9px;background:rgba(0,0,0,.06);font-size:.72rem;line-height:1.3}
    .pb-log li.ko{background:rgba(246,198,47,.26);font-weight:800}
    .pb-log li.ev{background:rgba(246,198,47,.14)}
    .pb-log li.sp{background:rgba(0,0,0,.11)}
    .pb-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:90}
    .pb-conf i{position:absolute;top:-10%;left:50%;width:var(--w,8px);height:var(--h,12px);border-radius:2px;background:var(--c,#f6c62f);opacity:0;animation:pbfall var(--d,2200ms) ease-in var(--dl,0ms) forwards}
    .pb-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.42);z-index:9999}
    .pb-modal.open{display:flex}
    .pb-panel{width:min(100%,860px);max-height:min(86vh,700px);overflow:auto;border-radius:14px;padding:14px;background:#f8f8f8;box-shadow:0 12px 30px rgba(0,0,0,.32)}
    .pb-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
    .pb-panel h3{margin:0;font-size:1.1rem;font-weight:800}
    .pb-close{border:0;border-radius:999px;padding:7px 10px;background:rgba(0,0,0,.1);font-size:.74rem;font-weight:800;text-transform:uppercase;cursor:pointer}
    .pb-board{width:100%;border-collapse:collapse;font-size:.82rem}
    .pb-board th,.pb-board td{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(0,0,0,.1);white-space:nowrap}
    @media(max-width:980px){.pb-stage{grid-template-columns:1fr}.pb-feed{min-height:160px;height:260px;max-height:260px}}
    @media(max-width:860px){.pb-head{flex-direction:column;align-items:flex-start}.pb-hud{grid-template-columns:1fr}}
    @media(max-width:640px){.pb-picks{grid-template-columns:1fr}.pb-pick{grid-template-areas:"cb av name" "cb team team" "cb class class"}.pb-arena{min-height:260px}}
    @keyframes pbatk{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.08) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
    @keyframes pbcast{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(129,200,255,0))}45%{transform:scale(1.1);filter:drop-shadow(0 0 7px rgba(129,200,255,.75))}100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(129,200,255,0))}}
    @keyframes pbslam{0%{transform:scale(1)}44%{transform:scale(1.18)}100%{transform:scale(1)}}
    @keyframes pbdash{0%{transform:scale(1)}50%{transform:scale(.86)}100%{transform:scale(1)}}
    @keyframes pblunge{0%{transform:translateX(0) scale(1)}46%{transform:translateX(2px) scale(1.09)}100%{transform:translateX(0) scale(1)}}
    @keyframes pbspin{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.08) rotate(-16deg)}100%{transform:scale(1) rotate(0)}}
    @keyframes pbshoot{0%{transform:translateX(0) scale(1)}45%{transform:translateX(-1px) scale(1.06)}100%{transform:translateX(0) scale(1)}}
    @keyframes pbchant{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,233,133,0))}44%{transform:scale(1.08);filter:drop-shadow(0 0 8px rgba(255,233,133,.72))}100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,233,133,0))}}
    @keyframes pbswing{
      0%{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--sa,0deg) - 76deg)) scale(.64) scaleY(-1)}
      14%{opacity:1}
      62%{opacity:1;transform:translate(-50%,-50%) rotate(calc(var(--sa,0deg) + 18deg)) scale(1) scaleY(-1)}
      100%{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--sa,0deg) + 66deg)) scale(.9) scaleY(-1)}
    }
    @keyframes pbtrail{0%{opacity:0;transform:translateY(-50%) rotate(var(--ang,0deg)) scaleX(.2)}12%{opacity:1}100%{opacity:0;transform:translateY(-50%) rotate(var(--ang,0deg)) scaleX(1)}}
    @keyframes pbburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}36%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
    @keyframes pbhealburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.42)}26%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
    @keyframes pbhealp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--hx)),calc(-50% + var(--hy))) scale(.2)}}
    @keyframes pbfirefx{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) scale(1.3)}}
    @keyframes pbshock{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.9)}}
    @keyframes pbfall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate3d(var(--tx,0px),120vh,0) rotate(var(--rt,560deg))}}
  </style>

  <div class="pb-head">
    <h2 class="pb-title">Gladiator Arena</h2>
    <p class="pb-status" data-status>Select fighters, assign teams, then press Go</p>
  </div>

  <div class="pb-controls">
    <div class="pb-actions">
      <button class="pb-btn" type="button" data-select-all>Select All</button>
      <button class="pb-btn" type="button" data-clear-all>Clear All</button>
      <button class="pb-btn" type="button" data-random-teams>Random Teams</button>
      <button class="pb-btn" type="button" data-random-classes>Random Classes</button>
      <button class="pb-btn go" type="button" data-go>Go</button>
      <button class="pb-btn" type="button" data-reset>Reset</button>
    </div>
    <div class="pb-opts">
      <label class="pb-chip">Chaos
        <select data-chaos>
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
      </label>
      <label class="pb-chip"><input type="checkbox" data-events checked> Arena Events</label>
    </div>
    <div class="pb-picks" data-picks></div>
  </div>

  <div class="pb-hud">
    <div class="pb-cell"><span>Timer</span><strong data-hud-time>00:00</strong></div>
    <div class="pb-cell"><span>Phase</span><strong data-hud-phase>Idle</strong></div>
    <div class="pb-cell"><span>Alive</span><strong data-hud-alive>A:0 | B:0</strong></div>
  </div>

  <div class="pb-stage">
    <div class="pb-arena" data-arena>
      <div class="pb-ring"></div>
      <div class="pb-ring r2"></div>
      <div class="pb-divider"></div>
      <div class="pb-vfx" data-vfx></div>
      <div class="pb-conf" data-conf></div>
    </div>
    <aside class="pb-feed">
      <h4>Battle Feed</h4>
      <ul class="pb-log" data-log></ul>
    </aside>
  </div>

  <div class="pb-modal" data-modal>
    <div class="pb-panel">
      <div class="pb-panel-head">
        <h3 data-modal-title>Leaderboard</h3>
        <button class="pb-close" type="button" data-modal-close>Close</button>
      </div>
      <table class="pb-board">
        <thead>
          <tr><th>#</th><th>Name</th><th>Team</th><th>Class</th><th>Status</th><th>Kills</th><th>Damage</th><th>Power</th><th>Defense</th><th>Speed</th></tr>
        </thead>
        <tbody data-modal-body></tbody>
      </table>
    </div>
  </div>
