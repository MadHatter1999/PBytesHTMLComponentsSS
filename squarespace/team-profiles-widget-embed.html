<section class="pb-team-profiles" data-pb-team-profiles>
  <style>
    .pb-team-profiles {
      --pb-ink: #080f16;
      --pb-muted: #2d2d2d;
      --pb-font-heading: "Myrad Pro", "Myriad Pro", "Segoe UI", sans-serif;
      --pb-font-body: "Myrad Pro", "Myriad Pro", "Segoe UI", sans-serif;
      width: min(100%, 1400px);
      margin: 0 auto;
      padding: 0;
      background: transparent;
      color: var(--pb-ink);
      font-family: var(--pb-font-body);
      box-sizing: border-box;
    }

    .pb-team-profiles * {
      box-sizing: border-box;
    }

    .pb-team-profiles-profile {
      width: min(100%, 1400px);
      margin: 0 auto;
      padding: clamp(14px, 2.2vw, 30px);
    }

    .pb-team-profiles-profile + .pb-team-profiles-profile {
      margin-top: clamp(8px, 1.6vw, 20px);
    }

    .pb-team-profiles-profile.is-secondary {
      width: min(100%, 1320px);
      padding: clamp(8px, 1.2vw, 16px);
    }

    .pb-team-profiles-inner {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.78fr);
      gap: clamp(18px, 4vw, 64px);
      align-items: start;
    }

    .pb-team-profiles-profile.side-left .pb-team-profiles-content {
      order: 2;
    }

    .pb-team-profiles-profile.side-left .pb-team-profiles-media {
      order: 1;
      justify-self: start;
    }

    .pb-team-profiles-profile.side-right .pb-team-profiles-media {
      justify-self: end;
    }

    .pb-team-profiles-content {
      min-width: 0;
    }

    .pb-team-profiles-name {
      margin: 0 0 14px;
      font: 300 clamp(2rem, 4vw, 3.2rem) / 1.05 var(--pb-font-heading);
      letter-spacing: 0.01em;
      color: var(--pb-muted);
    }

    .pb-team-profiles-name strong {
      font-weight: 600;
      color: var(--pb-ink);
    }

    .pb-team-profiles-title {
      margin: 0 0 22px;
      font: 600 clamp(1.2rem, 2.2vw, 2.1rem) / 1.25 var(--pb-font-heading);
      letter-spacing: 0.16em;
      color: var(--pb-ink);
    }

    .pb-team-profiles-paragraph {
      margin: 0 0 16px;
      font: 400 clamp(1.03rem, 1.46vw, 2rem) / 1.52 var(--pb-font-body);
      color: var(--pb-ink);
      max-width: 68ch;
    }

    .pb-team-profiles-media {
      width: min(100%, 690px);
      margin-top: clamp(8px, 1.4vw, 20px);
    }

    .pb-team-profiles-profile.is-secondary .pb-team-profiles-inner {
      gap: clamp(12px, 2.2vw, 34px);
    }

    .pb-team-profiles-profile.is-secondary .pb-team-profiles-name {
      font: 300 clamp(1.62rem, 2.3vw, 2.2rem) / 1.06 var(--pb-font-heading);
    }

    .pb-team-profiles-profile.is-secondary .pb-team-profiles-title {
      font: 600 clamp(0.96rem, 1.2vw, 1.3rem) / 1.22 var(--pb-font-heading);
      letter-spacing: 0.11em;
    }

    .pb-team-profiles-profile.is-secondary .pb-team-profiles-paragraph {
      margin-bottom: 10px;
      font: 400 clamp(0.94rem, 0.92vw, 1.14rem) / 1.42 var(--pb-font-body);
      max-width: 84ch;
    }

    .pb-team-profiles-profile.is-secondary .pb-team-profiles-media {
      width: min(100%, 500px);
      margin-top: clamp(2px, 0.5vw, 8px);
    }

    .pb-team-profiles-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter:
        drop-shadow(0 10px 18px rgba(0, 0, 0, 0.08))
        drop-shadow(0 26px 32px rgba(0, 0, 0, 0.08));
    }

    @media (max-width: 1024px) {
      .pb-team-profiles-inner {
        grid-template-columns: 1fr;
      }

      .pb-team-profiles-profile .pb-team-profiles-content {
        order: 2 !important;
      }

      .pb-team-profiles-profile .pb-team-profiles-media {
        order: 1 !important;
        justify-self: center !important;
        width: min(100%, 520px);
        margin-top: 0;
        margin-bottom: 8px;
      }

      .pb-team-profiles-profile.is-secondary .pb-team-profiles-media {
        width: min(100%, 430px);
      }

      .pb-team-profiles-paragraph {
        max-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .pb-team-profiles-profile {
        padding: 12px;
      }

      .pb-team-profiles-title {
        letter-spacing: 0.1em;
      }
    }
  </style>

        "blurb": "Jason Foote brings over 20 years of hospitality industry experience to his role in Customer Success at Pineapple Bytes. With more than 15 years of hands-on expertise working with NCR Aloha and a range of other leading hospitality systems, Jason offers a deep understanding of the unique challenges and operational needs of the industry.\n\nKnown for his problem-solving skills and customer-first mindset, Jason works closely with clients to ensure they get the most out of their technology. His experience in both front-of-house operations and back-end system support makes him a trusted advisor to hospitality businesses looking to streamline workflows and enhance guest experiences."

  <script>
    (function () {
      var widget = document.currentScript.closest("[data-pb-team-profiles]");
      if (!widget || widget.dataset.pbReady === "true") {
        return;
      }
      widget.dataset.pbReady = "true";

      var dataNode = widget.querySelector(".pb-team-profiles-data");

      function safeParseProfiles(node) {
        if (!node) {
          return [];
        }

        try {
          var parsed = JSON.parse(node.textContent.trim());
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function normalize(value) {
        if (typeof value === "string") {
          return value.trim();
        }
        if (value === undefined || value === null) {
          return "";
        }
        return String(value).trim();
      }

      function paragraphsFrom(value) {
        if (Array.isArray(value)) {
          return value.map(normalize).filter(Boolean);
        }
        var text = normalize(value);
        if (!text) {
          return [];
        }
        return text.split(/\n{2,}/).map(normalize).filter(Boolean);
      }

      function createNameNode(fullName, boldMode) {
        var heading = document.createElement("h2");
        var strong = document.createElement("strong");
        var cleanName = normalize(fullName);
        var parts = cleanName.split(/\s+/).filter(Boolean);
        var first;
        var last;
        var middle;

        heading.className = "pb-team-profiles-name";

        if (!parts.length) {
          heading.textContent = "";
          return heading;
        }

        if (parts.length === 1) {
          strong.textContent = parts[0];
          heading.appendChild(strong);
          return heading;
        }

        first = parts[0];
        last = parts[parts.length - 1];
        middle = parts.slice(1, parts.length - 1).join(" ");

        if (boldMode === "first") {
          strong.textContent = first;
          heading.appendChild(strong);
          heading.appendChild(document.createTextNode(" " + [middle, last].filter(Boolean).join(" ")));
          return heading;
        }

        heading.appendChild(document.createTextNode([first, middle].filter(Boolean).join(" ") + " "));
        strong.textContent = last;
        heading.appendChild(strong);
        return heading;
      }

      function resolveBoldMode(profile, isSecondary, secondaryIndex) {
        var explicit = normalize(profile.bold).toLowerCase();
        if (explicit === "first" || explicit === "last") {
          return explicit;
        }
        if (!isSecondary) {
          return "last";
        }
        return secondaryIndex % 2 === 0 ? "first" : "last";
      }

      function resolveImageSide(profile, isSecondary, secondaryIndex) {
        var explicit = normalize(profile.imageSide || profile.image_side).toLowerCase();
        if (explicit === "left" || explicit === "right") {
          return explicit;
        }
        if (!isSecondary) {
          return "right";
        }
        return secondaryIndex % 2 === 0 ? "left" : "right";
      }

      function buildProfile(profile, secondaryIndex) {
        var name = normalize(profile.name);
        var title = normalize(profile.title);
        var image = normalize(profile.img_url || profile.img || profile.image);
        var blurb = paragraphsFrom(profile.blurb);
        var priority = normalize(profile.priority).toLowerCase() === "primary" ? "primary" : "secondary";
        var isSecondary = priority === "secondary";
        var boldMode = resolveBoldMode(profile, isSecondary, secondaryIndex);
        var side = resolveImageSide(profile, isSecondary, secondaryIndex);
        var section;
        var inner;
        var content;
        var media;
        var imageNode;
        var titleNode;

        section = document.createElement("section");
        section.className =
          "pb-team-profiles-profile " +
          (isSecondary ? "is-secondary " : "is-primary ") +
          (side === "left" ? "side-left" : "side-right");

        inner = document.createElement("div");
        inner.className = "pb-team-profiles-inner";

        content = document.createElement("article");
        content.className = "pb-team-profiles-content";
        content.appendChild(createNameNode(name, boldMode));

        if (title) {
          titleNode = document.createElement("h3");
          titleNode.className = "pb-team-profiles-title";
          titleNode.textContent = title;
          content.appendChild(titleNode);
        }

        blurb.forEach(function (paragraph) {
          var node = document.createElement("p");
          node.className = "pb-team-profiles-paragraph";
          node.textContent = paragraph;
          content.appendChild(node);
        });

        media = document.createElement("aside");
        media.className = "pb-team-profiles-media";

        if (image) {
          imageNode = document.createElement("img");
          imageNode.className = "pb-team-profiles-image";
          imageNode.src = image;
          imageNode.alt = name ? name + " portrait" : "Team portrait";
          imageNode.loading = "lazy";
          imageNode.decoding = "async";
          media.appendChild(imageNode);
        }

        inner.appendChild(content);
        inner.appendChild(media);
        section.appendChild(inner);
        return section;
      }

      var profiles = safeParseProfiles(dataNode).filter(function (profile) {
        return profile && (profile.name || profile.img_url || profile.img || profile.image || profile.blurb);
      });

      if (!profiles.length) {
        return;
      }

      var secondaryIndex = 0;
      profiles.forEach(function (profile) {
        var isSecondary = normalize(profile.priority).toLowerCase() !== "primary";
        widget.appendChild(buildProfile(profile, secondaryIndex));
        if (isSecondary) {
          secondaryIndex += 1;
        }
      });
    })();
  </script>
</section>
