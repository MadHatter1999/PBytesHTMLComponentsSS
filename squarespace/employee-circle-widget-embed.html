<section class="pb-employee-gaggle">
  <style>
    .pb-employee-gaggle {
      --pb-yellow: #f6c62f;
      --pb-yellow-soft: rgba(246, 198, 47, 0.2);
      --pb-yellow-strong: rgba(246, 198, 47, 0.34);
      --pb-ink: #19313c;
      --pb-muted: #62737c;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: clamp(12px, 2vw, 24px);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--pb-ink);
    }

    .pb-employee-gaggle * {
      box-sizing: border-box;
    }

    .pb-employee-gaggle__stage {
      position: relative;
      min-height: clamp(380px, 58vw, 760px);
      overflow: hidden;
      isolation: isolate;
    }

    .pb-employee-gaggle__person {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--pb-size, 130px);
      text-align: center;
      z-index: var(--pb-layer, 2);
      will-change: transform;
    }

    .pb-employee-gaggle__person:hover,
    .pb-employee-gaggle__person:focus-within {
      z-index: 999;
    }

    .pb-employee-gaggle__circle {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 3%;
      border-radius: 999px;
      background: transparent;
      box-shadow: 0 18px 30px rgba(25, 49, 60, 0.08);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
      overflow: visible;
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__circle,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__circle {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 24px 38px rgba(25, 49, 60, 0.12);
    }

    .pb-employee-gaggle__avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 999px;
      transform: scale(1.08);
      filter:
        drop-shadow(0 0 10px rgba(246, 198, 47, 0.26))
        drop-shadow(0 0 20px rgba(246, 198, 47, 0.18));
      transition: filter 180ms ease;
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__avatar,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__avatar {
      filter:
        drop-shadow(0 0 12px rgba(246, 198, 47, 0.34))
        drop-shadow(0 0 24px rgba(246, 198, 47, 0.22));
    }

    .pb-employee-gaggle__name {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 20px rgba(25, 49, 60, 0.08);
      font: 800 0.9rem/1.1 "Segoe UI", sans-serif;
      color: var(--pb-ink);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-6px) scale(0.96);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
      pointer-events: none;
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__name,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__name {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pb-employee-gaggle__empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      text-align: center;
      color: var(--pb-muted);
      font: 700 1rem/1.4 "Segoe UI", sans-serif;
    }

    @media (max-width: 767px) {
      .pb-employee-gaggle {
        padding: 8px;
      }

      .pb-employee-gaggle__stage {
        min-height: 400px;
      }

      .pb-employee-gaggle__name {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pb-employee-gaggle__circle,
      .pb-employee-gaggle__name,
      .pb-employee-gaggle__avatar {
        transition: none;
      }
    }
  </style>

  <script>
    (function () {
      var widget = document.currentScript.closest(".pb-employee-gaggle");

      if (!widget || widget.dataset.pbGaggleReady === "true") {
        return;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function safeParseEmployees(node) {
        if (!node) {
          return [];
        }

        try {
          var parsed = JSON.parse(node.textContent.trim());
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function buildEmployeeCard(employee, index) {
        var person = document.createElement("article");
        var circle = document.createElement("div");
        var avatar = document.createElement("img");
        var name = document.createElement("div");

        person.className = "pb-employee-gaggle__person";
        person.dataset.index = String(index);
        circle.className = "pb-employee-gaggle__circle";
        avatar.className = "pb-employee-gaggle__avatar";
        name.className = "pb-employee-gaggle__name";

        avatar.src = employee.img || "";
        avatar.alt = employee.name ? employee.name + " portrait" : "Employee portrait";
        avatar.loading = "lazy";
        avatar.decoding = "async";
        name.textContent = employee.name || "Team member";

        circle.appendChild(avatar);
        person.appendChild(circle);
        person.appendChild(name);
        return person;
      }

      function buildEmpty() {
        var empty = document.createElement("div");
        empty.className = "pb-employee-gaggle__empty";
        empty.textContent = "Add a JSON array of { name, img } objects to populate the widget.";
        return empty;
      }

      function shuffleArray(items) {
        var copy = items.slice();
        var i;

        for (i = copy.length - 1; i > 0; i -= 1) {
          var swapIndex = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[swapIndex];
          copy[swapIndex] = temp;
        }

        return copy;
      }

      function getClusterSlots(count, stepX, stepY) {
        var slots = [];
        var columns = Math.ceil(Math.sqrt(count));
        var rows = Math.ceil(count / columns);
        var row;
        var column;
        var placed = 0;
        var yOffset = ((rows - 1) * stepY) / 2;

        for (row = 0; row < rows; row += 1) {
          var remaining = count - placed;
          var itemsInRow = Math.min(columns, remaining);
          var rowWidth = (itemsInRow - 1) * stepX;
          var rowOffset = rowWidth / 2;

          for (column = 0; column < itemsInRow; column += 1) {
            slots.push({
              x: column * stepX - rowOffset,
              y: row * stepY - yOffset
            });
            placed += 1;
          }
        }

        return slots;
      }

      function buildNodes(stage, people) {
        var width = stage.clientWidth;
        var height = stage.clientHeight;
        var count = people.length;
        var minSide = Math.min(width, height);
        var normalizedSize = clamp(minSide * 0.14, 84, 132) + 14;
        var stepX = normalizedSize * 0.92;
        var stepY = normalizedSize * 0.88;
        var slots = getClusterSlots(count, stepX, stepY);
        var spawnYOffset = -height * 0.26;

        return people.map(function (person, index) {
          var slot = slots[index % slots.length];
          var size = normalizedSize;
          var x = slot.x + (Math.random() - 0.5) * 18;
          var y = slot.y + spawnYOffset + (Math.random() - 0.5) * 10;
          var tilt = index % 2 === 0 ? -6 : 6;

          if (width < 768) {
            x *= 0.9;
            y *= 0.9;
            size *= 0.9;
          }

          person.style.width = size.toFixed(1) + "px";
          person.style.setProperty("--pb-layer", "2");

          return {
            element: person,
            x: x,
            y: y,
            vx: 0,
            vy: 0,
            size: size,
            radius: size * 0.5,
            tilt: tilt,
            seed: index * 0.7
          };
        });
      }

      function updateNodeMetrics(stage, nodes) {
        var width = stage.clientWidth;
        var height = stage.clientHeight;
        var minSide = Math.min(width, height);
        var normalizedSize = clamp(minSide * 0.14, 84, 132) + 14;

        nodes.forEach(function (node) {
          var size = width < 768 ? normalizedSize * 0.9 : normalizedSize;
          var maxX = width / 2 - size * 0.5 - 6;
          var maxY = height / 2 - size * 0.5 - 6;

          node.size = size;
          node.radius = size * 0.5;
          node.element.style.width = size.toFixed(1) + "px";
          node.x = clamp(node.x, -maxX, maxX);
          node.y = clamp(node.y, -maxY, maxY);
        });
      }

      function renderNodes(nodes) {
        nodes.forEach(function (node) {
          var liveTilt = node.tilt + clamp(node.vx * 0.35, -4, 4);
          if (!node.element.matches(":hover") && !node.element.matches(":focus-within")) {
            node.element.style.zIndex = String(100 + Math.round(node.y + 400));
          }
          node.element.style.transform =
            "translate(calc(-50% + " +
            node.x.toFixed(1) +
            "px), calc(-50% + " +
            node.y.toFixed(1) +
            "px)) rotate(" +
            liveTilt.toFixed(2) +
            "deg)";
        });
      }

      function createPhysics(stage, nodes) {
        var pointer = { active: false, x: 0, y: 0, radius: 0 };
        var rafId = 0;
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var gravity = reducedMotion ? 0 : 0.22;

        function updatePointer(clientX, clientY) {
          var bounds = stage.getBoundingClientRect();
          pointer.x = clientX - bounds.left - bounds.width / 2;
          pointer.y = clientY - bounds.top - bounds.height / 2;
          pointer.active = true;
        }

        stage.addEventListener("mousemove", function (event) {
          updatePointer(event.clientX, event.clientY);
        });

        stage.addEventListener(
          "touchmove",
          function (event) {
            if (event.touches && event.touches[0]) {
              updatePointer(event.touches[0].clientX, event.touches[0].clientY);
            }
          },
          { passive: true }
        );

        function clearPointer() {
          pointer.active = false;
        }

        stage.addEventListener("mouseleave", clearPointer);
        stage.addEventListener("touchend", clearPointer);
        stage.addEventListener("touchcancel", clearPointer);

        function tick() {
          var width = stage.clientWidth;
          var height = stage.clientHeight;
          var maxX = width / 2;
          var maxY = height / 2;
          var i;
          var j;

          for (i = 0; i < nodes.length; i += 1) {
            var node = nodes[i];
            node.vy += gravity;
            node.vx += Math.sin(Date.now() * 0.001 + node.seed) * 0.003;
          }

          for (i = 0; i < nodes.length; i += 1) {
            for (j = i + 1; j < nodes.length; j += 1) {
              var a = nodes[i];
              var b = nodes[j];
              var dx = b.x - a.x;
              var dy = b.y - a.y;
              var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
              var minimum = a.radius + b.radius;

              if (distance < minimum) {
                var overlap = (minimum - distance) / distance;
                var pushX = dx * overlap * 0.5;
                var pushY = dy * overlap * 0.5;

                a.x -= pushX;
                a.y -= pushY;
                b.x += pushX;
                b.y += pushY;

                a.vx -= pushX * 0.03;
                a.vy -= pushY * 0.03;
                b.vx += pushX * 0.03;
                b.vy += pushY * 0.03;
              }
            }
          }

          if (pointer.active) {
            for (i = 0; i < nodes.length; i += 1) {
              var currentNode = nodes[i];
              var dxMouse = currentNode.x - pointer.x;
              var dyMouse = currentNode.y - pointer.y;
              var mouseDistance = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse) || 0.001;
              var mouseMinimum = currentNode.radius + pointer.radius;

              if (mouseDistance < mouseMinimum) {
                var mouseOverlap = (mouseMinimum - mouseDistance) / mouseDistance;
                var mousePushX = dxMouse * mouseOverlap;
                var mousePushY = dyMouse * mouseOverlap;

                currentNode.x += mousePushX;
                currentNode.y += mousePushY;
                currentNode.vx += mousePushX * 0.08;
                currentNode.vy += mousePushY * 0.08;
              }
            }
          }

          for (i = 0; i < nodes.length; i += 1) {
            var current = nodes[i];
            var limitX = maxX - current.radius - 6;
            var ceilingY = -maxY + current.radius + 6;
            var floorY = maxY - current.radius - 6;

            current.vx *= 0.992;
            current.vy *= 0.992;

            current.x += current.vx;
            current.y += current.vy;

            if (current.x > limitX) {
              current.x = limitX;
              current.vx *= -0.72;
            } else if (current.x < -limitX) {
              current.x = -limitX;
              current.vx *= -0.72;
            }

            if (current.y > floorY) {
              current.y = floorY;
              current.vy *= -0.46;
              current.vx *= 0.96;

              if (Math.abs(current.vy) < 0.16) {
                current.vy = 0;
              }
            } else if (current.y < ceilingY) {
              current.y = ceilingY;
              current.vy *= -0.3;
            }
          }

          renderNodes(nodes);
          rafId = window.requestAnimationFrame(tick);
        }

        renderNodes(nodes);

        if (!reducedMotion) {
          rafId = window.requestAnimationFrame(tick);
        }

        return {
          stop: function () {
            if (rafId) {
              window.cancelAnimationFrame(rafId);
            }
          },
          relayout: function () {
            updateNodeMetrics(stage, nodes);
            renderNodes(nodes);
          }
        };
      }

      function init() {
        var stage = widget.querySelector(".pb-employee-gaggle__stage");
        var dataNode = widget.querySelector(".pb-employee-gaggle__data");
        var employees = safeParseEmployees(dataNode).filter(function (employee) {
          return employee && employee.name && employee.img;
        });

        if (!stage) {
          return;
        }

        stage.innerHTML = "";

        if (!employees.length) {
          stage.appendChild(buildEmpty());
          widget.dataset.pbGaggleReady = "true";
          return;
        }

        var people = shuffleArray(employees).map(buildEmployeeCard);
        people.forEach(function (person) {
          stage.appendChild(person);
        });

        var nodes = buildNodes(stage, people);
        var physics = createPhysics(stage, nodes);

        if ("ResizeObserver" in window) {
          var resizeObserver = new ResizeObserver(function () {
            physics.relayout();
          });
          resizeObserver.observe(stage);
          widget.pbResizeObserver = resizeObserver;
        } else {
          window.addEventListener("resize", physics.relayout);
        }

        widget.dataset.pbGaggleReady = "true";
      }

      init();
    })();
  </script>
</section>
