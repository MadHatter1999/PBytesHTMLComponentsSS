<section class="pb-employee-gaggle">
  <style>
    .pb-employee-gaggle {
      --pb-yellow: #f6c62f;
      --pb-yellow-soft: rgba(246, 198, 47, 0.2);
      --pb-yellow-strong: rgba(246, 198, 47, 0.34);
      --pb-ink: #19313c;
      --pb-muted: #62737c;
      --pb-anchor-x: 46%;
      --pb-anchor-y: 30%;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: clamp(12px, 2vw, 24px);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--pb-ink);
    }

    .pb-employee-gaggle * {
      box-sizing: border-box;
    }

    .pb-employee-gaggle__stage {
      position: relative;
      min-height: clamp(340px, 50vw, 660px);
      overflow: visible;
      isolation: isolate;
    }

    .pb-employee-gaggle__secret-icon {
      position: absolute;
      top: var(--pb-anchor-y);
      left: var(--pb-anchor-x);
      width: clamp(120px, 18vw, 220px);
      max-width: 42%;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2) rotate(-320deg);
      transform-origin: center;
      filter:
        drop-shadow(0 0 18px rgba(246, 198, 47, 0.22))
        drop-shadow(0 20px 30px rgba(25, 49, 60, 0.08));
      transition:
        opacity 420ms ease,
        transform 900ms cubic-bezier(0.2, 0.88, 0.22, 1),
        filter 900ms ease;
      z-index: 1200;
    }

    .pb-employee-gaggle__person {
      position: absolute;
      top: var(--pb-anchor-y);
      left: var(--pb-anchor-x);
      width: var(--pb-size, 130px);
      text-align: center;
      z-index: var(--pb-layer, 2);
      will-change: transform;
      transition:
        transform 1200ms cubic-bezier(0.2, 0.86, 0.24, 1),
        opacity 900ms ease,
        filter 900ms ease;
    }

    .pb-employee-gaggle__person:hover,
    .pb-employee-gaggle__person:focus-within {
      z-index: 999;
    }

    .pb-employee-gaggle--party .pb-employee-gaggle__circle {
      animation: pb-gaggle-dance 1180ms ease-in-out infinite;
      animation-delay: calc(var(--pb-delay, 0ms) * -1);
    }

    .pb-employee-gaggle--party .pb-employee-gaggle__avatar {
      animation: pb-gaggle-hue 3600ms linear infinite;
      animation-delay: calc(var(--pb-delay, 0ms) * -1);
    }

    .pb-employee-gaggle--party .pb-employee-gaggle__person:nth-child(3n) .pb-employee-gaggle__circle {
      animation-duration: 980ms;
    }

    .pb-employee-gaggle--party .pb-employee-gaggle__person:nth-child(4n) .pb-employee-gaggle__circle {
      animation-duration: 1320ms;
    }

    .pb-employee-gaggle--secret-whirl .pb-employee-gaggle__name {
      opacity: 0 !important;
      transform: translateY(-8px) scale(0.88) !important;
    }

    .pb-employee-gaggle--secret-whirl .pb-employee-gaggle__person {
      pointer-events: none;
    }

    .pb-employee-gaggle--secret-icon-in .pb-employee-gaggle__secret-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(0deg);
      filter:
        drop-shadow(0 0 22px rgba(246, 198, 47, 0.28))
        drop-shadow(0 24px 34px rgba(25, 49, 60, 0.1));
    }

    .pb-employee-gaggle__circle {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 3%;
      border-radius: 999px;
      background: transparent;
      box-shadow: 0 18px 30px rgba(25, 49, 60, 0.08);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
      overflow: visible;
    }

    .pb-employee-gaggle--intro .pb-employee-gaggle__circle {
      opacity: 0;
      animation: pb-gaggle-spin-in 760ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      animation-delay: var(--pb-delay, 0ms);
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__circle,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__circle {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 24px 38px rgba(25, 49, 60, 0.12);
    }

    .pb-employee-gaggle__avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 999px;
      transform: scale(1.08);
      filter:
        drop-shadow(0 0 10px rgba(246, 198, 47, 0.26))
        drop-shadow(0 0 20px rgba(246, 198, 47, 0.18));
      transition: filter 180ms ease;
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__avatar,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__avatar {
      filter:
        drop-shadow(0 0 12px rgba(246, 198, 47, 0.34))
        drop-shadow(0 0 24px rgba(246, 198, 47, 0.22));
    }

    .pb-employee-gaggle__name {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 20px rgba(25, 49, 60, 0.08);
      font: 800 0.9rem/1.1 "Segoe UI", sans-serif;
      color: var(--pb-ink);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-6px) scale(0.96);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
      pointer-events: none;
    }

    .pb-employee-gaggle__person:hover .pb-employee-gaggle__name,
    .pb-employee-gaggle__person:focus-within .pb-employee-gaggle__name {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pb-employee-gaggle__empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      text-align: center;
      color: var(--pb-muted);
      font: 700 1rem/1.4 "Segoe UI", sans-serif;
    }

    @media (max-width: 767px) {
      .pb-employee-gaggle {
        --pb-anchor-x: 50%;
        --pb-anchor-y: 50%;
        padding: 8px;
      }

      .pb-employee-gaggle__stage {
        min-height: 400px;
      }

      .pb-employee-gaggle__name {
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pb-employee-gaggle--intro .pb-employee-gaggle__circle,
      .pb-employee-gaggle__circle,
      .pb-employee-gaggle__name,
      .pb-employee-gaggle__avatar {
        transition: none;
        animation: none;
        opacity: 1;
      }

      .pb-employee-gaggle__person,
      .pb-employee-gaggle__secret-icon {
        transition: none;
      }
    }

    @keyframes pb-gaggle-spin-in {
      0% {
        opacity: 0;
        transform: rotate(-180deg) scale(0.35);
      }

      70% {
        opacity: 1;
        transform: rotate(12deg) scale(1.08);
      }

      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes pb-gaggle-dance {
      0% {
        transform: translateY(0) rotate(-4deg) scale(1);
      }

      25% {
        transform: translateY(-11px) rotate(5deg) scale(1.04);
      }

      50% {
        transform: translateY(4px) rotate(-3deg) scale(0.98);
      }

      75% {
        transform: translateY(-7px) rotate(3deg) scale(1.03);
      }

      100% {
        transform: translateY(0) rotate(-4deg) scale(1);
      }
    }

    @keyframes pb-gaggle-hue {
      0% {
        filter:
          hue-rotate(0deg)
          saturate(1)
          drop-shadow(0 0 10px rgba(246, 198, 47, 0.26))
          drop-shadow(0 0 20px rgba(246, 198, 47, 0.18));
      }

      25% {
        filter:
          hue-rotate(70deg)
          saturate(1.15)
          drop-shadow(0 0 12px rgba(246, 198, 47, 0.28))
          drop-shadow(0 0 22px rgba(246, 198, 47, 0.2));
      }

      50% {
        filter:
          hue-rotate(150deg)
          saturate(1.22)
          drop-shadow(0 0 12px rgba(246, 198, 47, 0.3))
          drop-shadow(0 0 24px rgba(246, 198, 47, 0.22));
      }

      75% {
        filter:
          hue-rotate(235deg)
          saturate(1.1)
          drop-shadow(0 0 11px rgba(246, 198, 47, 0.28))
          drop-shadow(0 0 22px rgba(246, 198, 47, 0.2));
      }

      100% {
        filter:
          hue-rotate(360deg)
          saturate(1)
          drop-shadow(0 0 10px rgba(246, 198, 47, 0.26))
          drop-shadow(0 0 20px rgba(246, 198, 47, 0.18));
      }
    }

  <script>
    (function () {
      var widget = document.currentScript.closest(".pb-employee-gaggle");

      if (!widget || widget.dataset.pbGaggleReady === "true") {
        return;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function safeParseEmployees(node) {
        if (!node) {
          return [];
        }

        try {
          var parsed = JSON.parse(node.textContent.trim());
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function normalizeName(value) {
        if (typeof value === "string") {
          return value.trim();
        }

        if (value === undefined || value === null) {
          return "";
        }

        return String(value).trim();
      }

      function buildEmployeeCard(employee, index) {
        var person = document.createElement("article");
        var circle = document.createElement("div");
        var avatar = document.createElement("img");
        var employeeName = normalizeName(employee.name);

        person.className = "pb-employee-gaggle__person";
        person.dataset.index = String(index);
        person.dataset.personName = employeeName;
        circle.className = "pb-employee-gaggle__circle";
        avatar.className = "pb-employee-gaggle__avatar";

        avatar.src = employee.img || "";
        avatar.alt = employeeName ? employeeName + " portrait" : "Employee portrait";
        avatar.loading = "lazy";
        avatar.decoding = "async";

        circle.appendChild(avatar);
        person.appendChild(circle);

        if (employeeName) {
          var name = document.createElement("div");
          name.className = "pb-employee-gaggle__name";
          name.textContent = employeeName;
          person.appendChild(name);
        }

        return person;
      }

      function buildEmpty() {
        var empty = document.createElement("div");
        empty.className = "pb-employee-gaggle__empty";
        empty.textContent = "Add a JSON array of { name, img } objects to populate the widget.";
        return empty;
      }

      function getClusterSlots(count, stepX, stepY) {
        var slots = [];
        var placed = 0;
        var ring = 0;
        var baseRadius = Math.max(stepX, stepY) * 0.92;

        while (placed < count) {
          if (ring === 0) {
            slots.push({
              x: 0,
              y: 0
            });
            placed += 1;
            ring += 1;
            continue;
          }

          var radiusX = baseRadius * ring;
          var radiusY = radiusX * 0.88;
          var circumference = Math.PI * (radiusX + radiusY);
          var ringCount = Math.max(6, Math.round(circumference / Math.max(stepX, stepY)));
          var angleOffset = ring % 2 === 0 ? Math.PI / ringCount : Math.PI / (ringCount * 2);
          var index;

          for (index = 0; index < ringCount && placed < count; index += 1) {
            var angle = (Math.PI * 2 * index) / ringCount + angleOffset;
            slots.push({
              x: Math.cos(angle) * radiusX,
              y: Math.sin(angle) * radiusY
            });
            placed += 1;
          }

          ring += 1;
        }

        return slots;
      }

      function buildNodes(stage, people) {
        var width = stage.clientWidth;
        var height = stage.clientHeight;
        var count = people.length;
        var minSide = Math.min(width, height);
        var stepX = clamp(width * 0.16, 92, 132);
        var stepY = clamp(height * 0.16, 92, 132);
        var normalizedSize = clamp(minSide * 0.17, 96, 154) + 36;
        var clusterOffsetX = width < 768 ? 0 : clamp(width * 0.11, 44, 110);
        var clusterOffsetY = width < 768 ? 0 : clamp(height * 0.16, 64, 150);
        var slots = getClusterSlots(count, stepX, stepY);

        return people.map(function (person, index) {
          var slot = slots[index % slots.length];
          var size = normalizedSize;
          var x = slot.x;
          var y = slot.y;
          var tilt = index % 2 === 0 ? -6 : 6;

          if (width < 768) {
            x *= 0.9;
            y *= 0.92;
            size *= 0.9;
          }

          x -= clusterOffsetX;
          y -= clusterOffsetY;

          person.style.width = size.toFixed(1) + "px";
          person.style.setProperty("--pb-layer", String(2 + ((index + 1) % 4)));
          person.style.setProperty("--pb-delay", String(index * 70) + "ms");

          return {
            element: person,
            targetX: x,
            targetY: y,
            x: x + (index % 2 === 0 ? -18 : 18),
            y: y + (index % 3 === 0 ? -12 : 12),
            vx: 0,
            vy: 0,
            size: size,
            radius: size * 0.47,
            tilt: tilt,
            seed: index * 0.7
          };
        });
      }

      function updateNodeTargets(stage, nodes) {
        var refreshed = buildNodes(
          stage,
          nodes.map(function (node) {
            return node.element;
          })
        );

        refreshed.forEach(function (nextNode, index) {
          var node = nodes[index];
          node.targetX = nextNode.targetX;
          node.targetY = nextNode.targetY;
          node.size = nextNode.size;
          node.radius = nextNode.radius;
          node.tilt = nextNode.tilt;
          node.element.style.width = nextNode.size.toFixed(1) + "px";
          node.element.style.setProperty("--pb-layer", nextNode.element.style.getPropertyValue("--pb-layer"));
        });
      }

      function renderNodes(nodes) {
        nodes.forEach(function (node) {
          var liveTilt = node.tilt + clamp(node.vx * 0.35, -4, 4);
          node.element.style.transform =
            "translate(calc(-50% + " +
            node.x.toFixed(1) +
            "px), calc(-50% + " +
            node.y.toFixed(1) +
            "px)) rotate(" +
            liveTilt.toFixed(2) +
            "deg)";
        });
      }

      function createPhysics(stage, nodes) {
        var pointer = { active: false, x: 0, y: 0 };
        var rafId = 0;
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function updatePointer(clientX, clientY) {
          var bounds = stage.getBoundingClientRect();
          pointer.x = clientX - bounds.left - bounds.width / 2;
          pointer.y = clientY - bounds.top - bounds.height / 2;
          pointer.active = true;
        }

        stage.addEventListener("mousemove", function (event) {
          updatePointer(event.clientX, event.clientY);
        });

        stage.addEventListener(
          "touchmove",
          function (event) {
            if (event.touches && event.touches[0]) {
              updatePointer(event.touches[0].clientX, event.touches[0].clientY);
            }
          },
          { passive: true }
        );

        function clearPointer() {
          pointer.active = false;
        }

        stage.addEventListener("mouseleave", clearPointer);
        stage.addEventListener("touchend", clearPointer);
        stage.addEventListener("touchcancel", clearPointer);

        function tick() {
          var width = stage.clientWidth;
          var height = stage.clientHeight;
          var maxX = width / 2;
          var maxY = height / 2;
          var i;
          var j;

          for (i = 0; i < nodes.length; i += 1) {
            var node = nodes[i];
            var drift = Math.sin(Date.now() * 0.0014 + node.seed) * 1.4;

            node.vx += (node.targetX - node.x) * 0.009;
            node.vy += (node.targetY - node.y) * 0.009 + drift * 0.002;

            if (pointer.active) {
              var dxPointer = node.x - pointer.x;
              var dyPointer = node.y - pointer.y;
              var pointerDistance = Math.sqrt(dxPointer * dxPointer + dyPointer * dyPointer) || 1;
              var pointerReach = node.radius + 90;

              if (pointerDistance < pointerReach) {
                var pointerPush = (pointerReach - pointerDistance) * 0.012;
                node.vx += (dxPointer / pointerDistance) * pointerPush;
                node.vy += (dyPointer / pointerDistance) * pointerPush;
              }
            }
          }

          for (i = 0; i < nodes.length; i += 1) {
            for (j = i + 1; j < nodes.length; j += 1) {
              var a = nodes[i];
              var b = nodes[j];
              var dx = b.x - a.x;
              var dy = b.y - a.y;
              var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
              var minimum = a.radius + b.radius + 16;

              if (distance < minimum) {
                var overlap = (minimum - distance) / distance;
                var pushX = dx * overlap * 0.5;
                var pushY = dy * overlap * 0.5;

                a.x -= pushX;
                a.y -= pushY;
                b.x += pushX;
                b.y += pushY;

                a.vx -= pushX * 0.03;
                a.vy -= pushY * 0.03;
                b.vx += pushX * 0.03;
                b.vy += pushY * 0.03;
              }
            }
          }

          for (i = 0; i < nodes.length; i += 1) {
            var current = nodes[i];
            var limitX = maxX - current.radius;
            var limitY = maxY - current.radius - 12;

            current.vx *= 0.92;
            current.vy *= 0.92;

            current.x += current.vx;
            current.y += current.vy;

            if (current.x > limitX) {
              current.x = limitX;
              current.vx *= -0.55;
            } else if (current.x < -limitX) {
              current.x = -limitX;
              current.vx *= -0.55;
            }

            if (current.y > limitY) {
              current.y = limitY;
              current.vy *= -0.5;
            } else if (current.y < -limitY) {
              current.y = -limitY;
              current.vy *= -0.5;
            }
          }

          renderNodes(nodes);
          rafId = window.requestAnimationFrame(tick);
        }

        renderNodes(nodes);

        if (!reducedMotion) {
          rafId = window.requestAnimationFrame(tick);
        }

        return {
          stop: function () {
            if (rafId) {
              window.cancelAnimationFrame(rafId);
            }
          },
          relayout: function () {
            updateNodeTargets(stage, nodes);
            renderNodes(nodes);
          },
          snapshot: function () {
            return nodes.map(function (node) {
              return {
                element: node.element,
                x: node.x,
                y: node.y,
                vx: node.vx,
                vy: node.vy,
                tilt: node.tilt
              };
            });
          }
        };
      }

      function shuffle(items) {
        var copy = items.slice();
        var i;

        for (i = copy.length - 1; i > 0; i -= 1) {
          var swapIndex = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[swapIndex];
          copy[swapIndex] = temp;
        }

        return copy;
      }

      function buildTonyPlinkoMarkup() {
        return (
          '<style>' +

          '</style>' +
          '<div class="pb-plinko__shell"><div class="pb-plinko__toolbar"><h2 class="pb-plinko__title">Team Plinko</h2><div class="pb-plinko__actions"><button class="pb-plinko__button pb-plinko__drop" type="button">Drop</button><button class="pb-plinko__button pb-plinko__reset" type="button">Reset</button></div></div><div class="pb-plinko__board"><div class="pb-plinko__drop-zone"></div><div class="pb-plinko__pegs"></div><div class="pb-plinko__dividers"></div><div class="pb-plinko__slots"></div><div class="pb-plinko__disks"></div></div><div class="pb-plinko__queue"></div></div>'

      function initTonyPlinko(plinkoWidget, employees) {
        var board = plinkoWidget.querySelector(".pb-plinko__board");
        var pegsLayer = plinkoWidget.querySelector(".pb-plinko__pegs");
        var dividersLayer = plinkoWidget.querySelector(".pb-plinko__dividers");
        var slotsLayer = plinkoWidget.querySelector(".pb-plinko__slots");
        var disksLayer = plinkoWidget.querySelector(".pb-plinko__disks");
        var queue = plinkoWidget.querySelector(".pb-plinko__queue");
        var dropButton = plinkoWidget.querySelector(".pb-plinko__drop");
        var resetButton = plinkoWidget.querySelector(".pb-plinko__reset");
        var autoDropTimer = 0;
        var dragState = null;
        var pegs = [];
        var dividers = [];
        var disks = [];
        var available = [];
        var geometry = null;
        var resizeFrame = 0;

        function buildQueueDisk(person, index) {
          var button = document.createElement("button");
          var disk = document.createElement("div");
          var image = document.createElement("img");
          var personName = normalizeName(person.name);

          button.className = "pb-plinko__disk-button";
          button.type = "button";
          button.dataset.index = String(index);
          button.setAttribute("aria-label", personName ? "Drop " + personName : "Drop team member");
          disk.className = "pb-plinko__disk";
          image.className = "pb-plinko__disk-image";
          image.src = person.img || "";
          image.alt = personName ? personName + " portrait" : "Team member portrait";
          image.loading = "lazy";
          image.decoding = "async";
          disk.appendChild(image);

          if (personName) {
            var name = document.createElement("div");
            name.className = "pb-plinko__disk-name";
            name.textContent = personName;
            disk.appendChild(name);
          }

          button.appendChild(disk);
          button.addEventListener("pointerdown", function (event) {
            beginQueueDrag(event, person, button);
          });
          button.addEventListener("click", function () {
            if (button.dataset.pbSuppressClick === "true") {
              button.dataset.pbSuppressClick = "false";
              return;
            }
            dropPerson(person);
          });
          return button;
        }

        function buildToken(person) {
          var token = document.createElement("div");
          var image = document.createElement("img");
          var personName = normalizeName(person.name);

          token.className = "pb-plinko__token";
          token.style.setProperty("--pb-size", geometry.diskSize + "px");
          image.className = "pb-plinko__token-image";
          image.src = person.img || "";
          image.alt = personName ? personName + " portrait" : "Team member portrait";
          image.loading = "lazy";
          image.decoding = "async";
          token.appendChild(image);

          if (personName) {
            var name = document.createElement("div");
            name.className = "pb-plinko__disk-name";
            name.textContent = personName;
            token.appendChild(name);
          }

          disksLayer.appendChild(token);
          return token;
        }

        function buildDragGhost(person) {
          var ghost = document.createElement("div");
          var image = document.createElement("img");

          ghost.className = "pb-plinko__drag-ghost";
          image.className = "pb-plinko__token-image";
          image.src = person.img || "";
          image.alt = "";
          ghost.appendChild(image);
          document.body.appendChild(ghost);
          return ghost;
        }

        function computeGeometry() {
          var width = board.clientWidth;
          var slots = clamp(Math.round(width / 96), 7, 10);
          var slotWidth = width / slots;
          var baseHeight = board.clientHeight;
          var height = baseHeight;
          var diskSize = clamp(Math.min(width, height) * 0.086, 54, 78);
          var pegRadius = 7;
          var diskRadius = diskSize * 0.5;
          var pegSpacingX = clamp(diskSize * 1.34, 68, 98);
          var pegSpacingY = clamp(pegSpacingX * 0.9, 60, 88);
          var startY = 64;
          var slotDepth = Math.max(diskSize * 3.6, 206);
          var laneEntryGap = Math.max(diskSize * 1.18, pegSpacingY * 0.92);
          var rows = clamp(Math.floor((baseHeight - startY - slotDepth - laneEntryGap - 24) / pegSpacingY), 6, 10);
          var lastPegY = startY + (rows - 1) * pegSpacingY;
          var pegFieldBottom = lastPegY + pegRadius;
          var dividerTop = pegFieldBottom + laneEntryGap;
          var requiredHeight = pegFieldBottom + slotDepth + 20;
          var floorY;
          var leftBound;
          var rightBound;
          var edgeBuffer;
          var dropMinX;
          var dropMaxX;
          var bins = [];
          var i;

          if (requiredHeight > height) {
            height = requiredHeight;
          }

          floorY = height - 20;
          leftBound = diskRadius + 8;
          rightBound = width - diskRadius - 8;
          edgeBuffer = Math.max(slotWidth * 0.7, diskRadius * 1.4);
          dropMinX = leftBound + edgeBuffer;
          dropMaxX = rightBound - edgeBuffer;

          for (i = 0; i < slots; i += 1) {
            bins.push({ left: i * slotWidth, right: (i + 1) * slotWidth, center: i * slotWidth + slotWidth / 2 });
          }

          return {
            width: width,
            height: height,
            slots: slots,
            slotWidth: slotWidth,
            floorY: floorY,
            dividerTop: dividerTop,
            startY: startY,
            rows: rows,
            diskSize: diskSize,
            diskRadius: diskRadius,
            pegRadius: pegRadius,
            pegSpacingX: pegSpacingX,
            pegSpacingY: pegSpacingY,
            leftBound: leftBound,
            rightBound: rightBound,
            spawnY: 34,
            dropMinX: dropMinX,
            dropMaxX: dropMaxX,
            bins: bins
          };
        }

        function rebuildBoard() {
          geometry = computeGeometry();
          board.style.minHeight = geometry.height + "px";
          pegs = [];
          dividers = [];
          pegsLayer.innerHTML = "";
          dividersLayer.innerHTML = "";
          slotsLayer.innerHTML = "";

          var sideMargin = Math.max(geometry.diskRadius + 14, geometry.pegSpacingX * 0.8);
          var evenColumns = Math.max(5, Math.floor((geometry.width - sideMargin * 2) / geometry.pegSpacingX));
          var row;

          for (row = 0; row < geometry.rows; row += 1) {
            var rowColumns = row % 2 === 0 ? evenColumns : Math.max(4, evenColumns - 1);
            var rowWidth = (rowColumns - 1) * geometry.pegSpacingX;
            var x = geometry.width / 2 - rowWidth / 2;
            var y = geometry.startY + row * geometry.pegSpacingY;
            var placed = 0;

            while (placed < rowColumns) {
              var pegNode = document.createElement("div");
              pegNode.className = "pb-plinko__peg";
              pegNode.style.left = x + "px";
              pegNode.style.top = y + "px";
              pegsLayer.appendChild(pegNode);
              pegs.push({ x: x, y: y, radius: geometry.pegRadius });
              x += geometry.pegSpacingX;
              placed += 1;
            }
          }

          geometry.bins.forEach(function (bin, index) {
            if (index > 0) {
              var divider = document.createElement("div");
              divider.className = "pb-plinko__divider";
              divider.style.left = bin.left - 3 + "px";
              divider.style.height = geometry.height - geometry.dividerTop + "px";
              divider.style.top = geometry.dividerTop + "px";
              dividersLayer.appendChild(divider);
              dividers.push({ x: bin.left, top: geometry.dividerTop, bottom: geometry.floorY, halfWidth: 6 });
            }

            var slot = document.createElement("div");
            slot.className = "pb-plinko__slot";
            slot.style.left = bin.left + "px";
            slot.style.width = geometry.slotWidth + "px";
            slot.style.height = geometry.height - geometry.dividerTop + "px";
            slot.textContent = "Slot " + (index + 1);
            slotsLayer.appendChild(slot);
          });
        }

        function syncDiskToGeometry(disk, previousGeometry) {
          var xRatio;
          var yRatio;

          disk.radius = geometry.diskRadius;
          disk.element.style.setProperty("--pb-size", geometry.diskSize + "px");

          if (!previousGeometry) {
            disk.x = clamp(disk.x, geometry.leftBound, geometry.rightBound);
            disk.y = clamp(disk.y, geometry.diskRadius + 6, geometry.floorY - geometry.diskRadius);
            return;
          }

          xRatio = previousGeometry.width > 0 ? disk.x / previousGeometry.width : 0.5;
          yRatio = previousGeometry.height > 0 ? disk.y / previousGeometry.height : 0.2;

          disk.x = clamp(xRatio * geometry.width, geometry.leftBound, geometry.rightBound);
          disk.y = clamp(yRatio * geometry.height, geometry.diskRadius + 6, geometry.floorY - geometry.diskRadius);

          if (disk.settled) {
            disk.y = geometry.floorY - geometry.diskRadius;
            disk.x = clamp(findBinCenter(disk.x), geometry.leftBound, geometry.rightBound);
          }
        }

        function relayoutBoard() {
          var previousGeometry = geometry;

          rebuildBoard();
          disks.forEach(function (disk) {
            syncDiskToGeometry(disk, previousGeometry);
          });
        }

        function renderQueue() {
          queue.innerHTML = "";

          if (!available.length) {
            var empty = document.createElement("div");
            empty.className = "pb-plinko__queue-empty";
            empty.textContent = "All disks dropped. Hit reset to randomize and play again.";
            queue.appendChild(empty);
            dropButton.disabled = true;
            return;
          }

          available.forEach(function (person, index) {
            queue.appendChild(buildQueueDisk(person, index));
          });
          dropButton.disabled = false;
        }

        function findBinCenter(x) {
          var selected = geometry.bins[0];
          geometry.bins.forEach(function (bin) {
            if (x >= bin.left && x <= bin.right) {
              selected = bin;
            }
          });
          return selected.center;
        }

        function spawnDisk(person, x) {
          var token = buildToken(person);
          var startX = typeof x === "number" ? clamp(x, geometry.dropMinX, geometry.dropMaxX) : geometry.dropMinX + Math.random() * (geometry.dropMaxX - geometry.dropMinX);

          disks.push({
            person: person,
            element: token,
            x: startX,
            y: geometry.spawnY,
            vx: (Math.random() - 0.5) * 1.2,
            vy: 0,
            radius: geometry.diskRadius,
            settled: false,
            angle: 0,
            spin: (Math.random() - 0.5) * 0.08
          });
        }

        function dropPerson(person, x) {
          if (!person) {
            return;
          }

          spawnDisk(person, x);
          available = available.filter(function (candidate) {
            return candidate !== person;
          });
          renderQueue();
        }

        function pointerInsideBoard(clientX, clientY) {
          var bounds = board.getBoundingClientRect();
          return clientX >= bounds.left && clientX <= bounds.right && clientY >= bounds.top && clientY <= bounds.top + geometry.dividerTop;
        }

        function pointerToBoardX(clientX) {
          var bounds = board.getBoundingClientRect();
          return clamp(clientX - bounds.left, geometry.dropMinX, geometry.dropMaxX);
        }

        function updateDragGhost(clientX, clientY) {
          if (dragState && dragState.ghost) {
            dragState.ghost.style.left = clientX + "px";
            dragState.ghost.style.top = clientY + "px";
          }
        }

        function endQueueDrag(event) {
          if (!dragState) {
            return;
          }

          window.removeEventListener("pointermove", onQueueDragMove);
          window.removeEventListener("pointerup", endQueueDrag);
          window.removeEventListener("pointercancel", endQueueDrag);

          if (dragState.ghost) {
            dragState.ghost.remove();
          }

          if (dragState.dragging && pointerInsideBoard(event.clientX, event.clientY)) {
            dragState.button.dataset.pbSuppressClick = "true";
            dropPerson(dragState.person, pointerToBoardX(event.clientX));
          }

          dragState = null;
        }

        function onQueueDragMove(event) {
          if (!dragState) {
            return;
          }

          var dx = event.clientX - dragState.startX;
          var dy = event.clientY - dragState.startY;

          if (!dragState.dragging && Math.sqrt(dx * dx + dy * dy) > 8) {
            dragState.dragging = true;
            dragState.ghost = buildDragGhost(dragState.person);
            dragState.button.dataset.pbSuppressClick = "true";
          }

          if (dragState.dragging) {
            updateDragGhost(event.clientX, event.clientY);
          }
        }

        function beginQueueDrag(event, person, button) {
          if (!geometry || button.disabled || autoDropTimer) {
            return;
          }

          dragState = { person: person, button: button, startX: event.clientX, startY: event.clientY, dragging: false, ghost: null };
          window.addEventListener("pointermove", onQueueDragMove);
          window.addEventListener("pointerup", endQueueDrag);
          window.addEventListener("pointercancel", endQueueDrag);
        }

        function queueAutoDrop() {
          if (autoDropTimer) {
            window.clearTimeout(autoDropTimer);
          }

          if (!available.length) {
            dropButton.disabled = true;
            autoDropTimer = 0;
            return;
          }

          autoDropTimer = window.setTimeout(function () {
            autoDropTimer = 0;
            dropPerson(available[0]);
            queueAutoDrop();
          }, 900);
        }

        function resolveDiskCollision(a, b) {
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
          var minimum = a.radius + b.radius;

          if (distance >= minimum) {
            return;
          }

          var overlap = (minimum - distance) / distance;
          var pushX = dx * overlap * 0.5;
          var pushY = dy * overlap * 0.5;

          a.x -= pushX;
          a.y -= pushY;
          b.x += pushX;
          b.y += pushY;
          a.vx -= pushX * 0.05;
          a.vy -= pushY * 0.05;
          b.vx += pushX * 0.05;
          b.vy += pushY * 0.05;
        }

        function resolvePegCollision(disk, peg) {
          var dx = disk.x - peg.x;
          var dy = disk.y - peg.y;
          var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
          var minimum = disk.radius + peg.radius;

          if (distance >= minimum) {
            return;
          }

          var nx = dx / distance;
          var ny = dy / distance;
          var overlap = minimum - distance;
          var velocityAlongNormal = disk.vx * nx + disk.vy * ny;

          disk.x += nx * overlap;
          disk.y += ny * overlap;

          if (velocityAlongNormal < 0) {
            disk.vx -= 1.34 * velocityAlongNormal * nx;
            disk.vy -= 1.34 * velocityAlongNormal * ny;
            disk.vx += nx * 0.16;
          }
        }

        function resolveDividerCollision(disk, divider) {
          if (disk.y + disk.radius < divider.top || disk.y - disk.radius > divider.bottom) {
            return;
          }

          var dx = disk.x - divider.x;
          var reach = disk.radius + divider.halfWidth;

          if (Math.abs(dx) >= reach) {
            return;
          }

          disk.x = divider.x + (dx < 0 ? -1 : 1) * reach;
          disk.vx *= -0.68;
        }

        function frame() {
          var i;
          var j;

          if (!document.body.contains(plinkoWidget)) {
            return;
          }

          for (j = 0; j < 2; j += 1) {
            disks.forEach(function (disk) {
              if (disk.settled) {
                return;
              }

              disk.vy += 0.11;
              disk.x += disk.vx * 0.5;
              disk.y += disk.vy * 0.5;
              disk.angle += disk.spin + disk.vx * 0.008;
              disk.spin *= 0.988;

              if (disk.x < geometry.leftBound) {
                disk.x = geometry.leftBound;
                disk.vx *= -0.72;
              } else if (disk.x > geometry.rightBound) {
                disk.x = geometry.rightBound;
                disk.vx *= -0.72;
              }

              if (disk.y - disk.radius < 6) {
                disk.y = disk.radius + 6;
                disk.vy *= -0.35;
              }
            });

            for (i = 0; i < disks.length; i += 1) {
              for (j = i + 1; j < disks.length; j += 1) {
                resolveDiskCollision(disks[i], disks[j]);
              }
            }

            disks.forEach(function (disk) {
              pegs.forEach(function (peg) {
                resolvePegCollision(disk, peg);
              });

              dividers.forEach(function (divider) {
                resolveDividerCollision(disk, divider);
              });

              if (disk.y + disk.radius >= geometry.floorY) {
                disk.y = geometry.floorY - disk.radius;
                disk.vy *= -0.42;
                disk.vx *= 0.96;
                disk.spin *= 0.94;

                if (Math.abs(disk.vy) < 0.3) {
                  disk.vy = 0;
                }

                if (Math.abs(disk.vx) < 0.05 && disk.vy === 0) {
                  var center = findBinCenter(disk.x);
                  disk.x += (center - disk.x) * 0.05;

                  if (Math.abs(center - disk.x) < 0.6) {
                    disk.settled = true;
                    disk.vx = 0;
                    disk.spin *= 0.7;
                  }
                }
              }
            });
          }

          disks.forEach(function (disk) {
            disk.element.style.left = disk.x.toFixed(1) + "px";
            disk.element.style.top = disk.y.toFixed(1) + "px";
            disk.element.style.transform = "translate(-50%, -50%) rotate(" + disk.angle.toFixed(2) + "rad)";
          });

          window.requestAnimationFrame(frame);
        }

        function resetGame() {
          if (autoDropTimer) {
            window.clearTimeout(autoDropTimer);
            autoDropTimer = 0;
          }

          available = shuffle(employees);
          disks.forEach(function (disk) {
            disk.element.remove();
          });
          disks = [];
          rebuildBoard();
          renderQueue();
        }

        dropButton.addEventListener("click", function () {
          if (!available.length) {
            return;
          }

          dropPerson(available[0]);
          queueAutoDrop();
        });
        resetButton.addEventListener("click", resetGame);
        if ("ResizeObserver" in window) {
          var resizeObserver = new ResizeObserver(function () {
            if (resizeFrame) {
              window.cancelAnimationFrame(resizeFrame);
            }

            resizeFrame = window.requestAnimationFrame(function () {
              resizeFrame = 0;
              relayoutBoard();
            });
          });
          resizeObserver.observe(board);
        }

        resetGame();
        window.requestAnimationFrame(frame);
      }

      function renderTonyPlinko(physics, employees) {
        var nextWidget;

        if (!widget.parentNode) {
          return;
        }

        if (physics && typeof physics.stop === "function") {
          physics.stop();
        }

        if (widget.pbResizeObserver && typeof widget.pbResizeObserver.disconnect === "function") {
          widget.pbResizeObserver.disconnect();
        }

        nextWidget = document.createElement("section");
        nextWidget.className = "pb-plinko";
        nextWidget.setAttribute("data-title", "Team Plinko");
        nextWidget.innerHTML = buildTonyPlinkoMarkup();
        widget.replaceWith(nextWidget);
        initTonyPlinko(nextWidget, employees);
      }

      function animateSecretWhirl(physics, done) {
        var snapshot = physics && typeof physics.snapshot === "function" ? physics.snapshot() : [];
        var startTime = 0;
        var duration = 1080;

        function easeOutCubic(value) {
          return 1 - Math.pow(1 - value, 3);
        }

        function frame(time) {
          var progress;
          var eased;

          if (!startTime) {
            startTime = time;
          }

          progress = clamp((time - startTime) / duration, 0, 1);
          eased = easeOutCubic(progress);

          snapshot.forEach(function (node) {
            var angle = eased * Math.PI * 3.8;
            var orbitScale = 1 - eased * 0.8;
            var blurAmount = eased * 7;
            var opacity = progress < 0.58 ? 1 : 1 - (progress - 0.58) / 0.42;
            var liveTilt = node.tilt + clamp(node.vx * 0.35, -4, 4);
            var scaledX = node.x * orbitScale;
            var scaledY = node.y * orbitScale;
            var x = scaledX * Math.cos(angle) - scaledY * Math.sin(angle);
            var y = scaledX * Math.sin(angle) + scaledY * Math.cos(angle);
            var scale = 1 - eased * 0.72;

            node.element.style.opacity = clamp(opacity, 0, 1).toFixed(3);
            node.element.style.filter = "blur(" + blurAmount.toFixed(2) + "px)";
            node.element.style.transform =
              "translate(calc(-50% + " +
              x.toFixed(1) +
              "px), calc(-50% + " +
              y.toFixed(1) +
              "px)) scale(" +
              scale.toFixed(3) +
              ") rotate(" +
              liveTilt.toFixed(2) +
              "deg)";
          });

          if (progress < 1) {
            window.requestAnimationFrame(frame);
            return;
          }

          if (typeof done === "function") {
            done();
          }
        }

        window.requestAnimationFrame(frame);
      }

      function runTonyParty() {
        if (widget.dataset.pbTonyPartyTriggered === "true") {
          return;
        }

        widget.dataset.pbTonyPartyTriggered = "true";
        widget.classList.add("pb-employee-gaggle--party");
      }

      function attachTonyHoverTrigger(people) {
        var hoverTimer = 0;
        var tonyCard = people.find(function (person) {
          return (person.dataset.personName || "").toLowerCase() === "tony";
        });

        if (!tonyCard) {
          return;
        }

        function clearTrigger() {
          if (hoverTimer) {
            window.clearTimeout(hoverTimer);
            hoverTimer = 0;
          }
        }

        function armTrigger() {
          clearTrigger();
          hoverTimer = window.setTimeout(function () {
            hoverTimer = 0;
            runTonyParty();
          }, 60000);
        }

        tonyCard.addEventListener("mouseenter", armTrigger);
        tonyCard.addEventListener("mouseleave", clearTrigger);
        tonyCard.addEventListener("focusin", armTrigger);
        tonyCard.addEventListener("focusout", clearTrigger);
      }

      function init() {
        var stage = widget.querySelector(".pb-employee-gaggle__stage");
        var dataNode = widget.querySelector(".pb-employee-gaggle__data");
        var employees = safeParseEmployees(dataNode).filter(function (employee) {
          return employee && employee.img;
        });

        if (!stage) {
          return;
        }

        stage.innerHTML = "";

        if (!employees.length) {
          stage.appendChild(buildEmpty());
          widget.dataset.pbGaggleReady = "true";
          return;
        }

        var people = employees.map(buildEmployeeCard);
        people.forEach(function (person) {
          stage.appendChild(person);
        });

        var nodes = buildNodes(stage, people);
        var physics = createPhysics(stage, nodes);
        attachTonyHoverTrigger(people);
        widget.classList.add("pb-employee-gaggle--intro");

        window.setTimeout(function () {
          widget.classList.remove("pb-employee-gaggle--intro");
        }, 1800);

        if ("ResizeObserver" in window) {
          var resizeObserver = new ResizeObserver(function () {
            physics.relayout();
          });
          resizeObserver.observe(stage);
          widget.pbResizeObserver = resizeObserver;
        } else {
          window.addEventListener("resize", physics.relayout);
        }

        widget.dataset.pbGaggleReady = "true";
      }

      init();
    })();
  </script>
</section>
