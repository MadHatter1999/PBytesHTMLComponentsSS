<section class="pb-plinko" data-title="Team Plinko">
  <style>
    .pb-plinko {
      --pb-yellow: #f6c62f;
      --pb-yellow-strong: rgba(246, 198, 47, 0.34);
      --pb-yellow-soft: rgba(246, 198, 47, 0.16);
      --pb-ink: #19313c;
      --pb-muted: #62737c;
      --pb-surface: #f8f7f2;
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: clamp(12px, 2vw, 24px);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--pb-ink);
    }

    .pb-plinko * {
      box-sizing: border-box;
    }

    .pb-plinko__shell {
      display: grid;
      gap: 16px;
    }

    .pb-plinko__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pb-plinko__title {
      margin: 0;
      font: 800 clamp(1.1rem, 1.8vw, 1.5rem) / 1 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: -0.03em;
    }

    .pb-plinko__actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pb-plinko__button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--pb-yellow);
      color: #ffffff;
      font: 800 0.86rem/1 "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(246, 198, 47, 0.22);
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    .pb-plinko__button:hover,
    .pb-plinko__button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(246, 198, 47, 0.28);
      outline: none;
    }

    .pb-plinko__button[disabled] {
      opacity: 0.42;
      cursor: default;
      pointer-events: none;
      box-shadow: 0 10px 20px rgba(246, 198, 47, 0.14);
    }

    .pb-plinko__board {
      position: relative;
      min-height: clamp(520px, 72vw, 920px);
      border-radius: 30px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.72)),
        linear-gradient(180deg, #f9f8f4 0%, #efede6 100%);
      box-shadow: inset 0 0 0 1px rgba(25, 49, 60, 0.06), 0 24px 46px rgba(25, 49, 60, 0.08);
    }

    .pb-plinko__board::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1)),
        repeating-linear-gradient(
          90deg,
          rgba(25, 49, 60, 0.028) 0 1px,
          transparent 1px 24px
        );
      opacity: 0.6;
      pointer-events: none;
    }

    .pb-plinko__drop-zone {
      position: absolute;
      top: 20px;
      left: 50%;
      width: clamp(120px, 20%, 180px);
      height: 42px;
      transform: translateX(-50%);
      border: 2px dashed rgba(25, 49, 60, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      pointer-events: none;
    }

    .pb-plinko__drop-zone::after {
      content: "Drop";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 800 0.72rem/1 "Segoe UI", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(25, 49, 60, 0.5);
    }

    .pb-plinko__pegs,
    .pb-plinko__dividers,
    .pb-plinko__slots,
    .pb-plinko__disks {
      position: absolute;
      inset: 0;
    }

    .pb-plinko__peg {
      position: absolute;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 999px;
      background: rgba(25, 49, 60, 0.22);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.88);
      pointer-events: none;
    }

    .pb-plinko__divider {
      position: absolute;
      bottom: 0;
      width: 6px;
      border-radius: 999px 999px 0 0;
      background: rgba(25, 49, 60, 0.14);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.62);
      pointer-events: none;
    }

    .pb-plinko__slot {
      position: absolute;
      bottom: 0;
      display: grid;
      place-items: end center;
      padding-bottom: 14px;
      font: 800 0.72rem/1 "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(25, 49, 60, 0.42);
      pointer-events: none;
    }

    .pb-plinko__disk-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease, filter 160ms ease;
    }

    .pb-plinko__disk-button:hover,
    .pb-plinko__disk-button:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.03);
      outline: none;
    }

    .pb-plinko__disk-button[disabled] {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .pb-plinko__queue {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      min-height: 74px;
    }

    .pb-plinko__queue-empty {
      font: 700 0.92rem/1.3 "Segoe UI", sans-serif;
      color: var(--pb-muted);
    }

    .pb-plinko__disk,
    .pb-plinko__token {
      position: relative;
      width: 72px;
      aspect-ratio: 1 / 1;
      border-radius: 999px;
    }

    .pb-plinko__token {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--pb-size, 112px);
      height: var(--pb-size, 112px);
      will-change: transform;
      z-index: var(--pb-layer, 10);
      transform: translate(-50%, -50%);
    }

    .pb-plinko__disk-image,
    .pb-plinko__token-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 999px;
      filter:
        drop-shadow(0 0 8px rgba(246, 198, 47, 0.24))
        drop-shadow(0 0 18px rgba(246, 198, 47, 0.16));
      user-select: none;
      -webkit-user-drag: none;
    }

    .pb-plinko__disk-name {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 18px rgba(25, 49, 60, 0.08);
      font: 800 0.74rem/1 "Segoe UI", sans-serif;
      color: var(--pb-ink);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    .pb-plinko__disk-button:hover .pb-plinko__disk-name,
    .pb-plinko__disk-button:focus-visible .pb-plinko__disk-name,
    .pb-plinko__token:hover .pb-plinko__disk-name {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

      @media (max-width: 767px) {
      .pb-plinko {
        padding: 8px;
      }

      .pb-plinko__board {
        min-height: 520px;
        border-radius: 22px;
      }

      .pb-plinko__disk,
      .pb-plinko__token {
        width: 62px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pb-plinko__button,
      .pb-plinko__disk-button,
      .pb-plinko__disk-name {
        transition: none;
      }
    }
  </style>

  <script>
    (function () {
      var widget = document.currentScript.closest(".pb-plinko");

      if (!widget || widget.dataset.pbPlinkoReady === "true") {
        return;
      }

      var board = widget.querySelector(".pb-plinko__board");
      var pegsLayer = widget.querySelector(".pb-plinko__pegs");
      var dividersLayer = widget.querySelector(".pb-plinko__dividers");
      var slotsLayer = widget.querySelector(".pb-plinko__slots");
      var disksLayer = widget.querySelector(".pb-plinko__disks");
      var queue = widget.querySelector(".pb-plinko__queue");
      var dropButton = widget.querySelector(".pb-plinko__drop");
      var resetButton = widget.querySelector(".pb-plinko__reset");
      var dataNode = widget.querySelector(".pb-plinko__data");
      var rafId = 0;
      var resizeObserver = null;
      var autoDropTimer = 0;
      var pegs = [];
      var dividers = [];
      var disks = [];
      var available = [];
      var geometry = null;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function shuffle(items) {
        var copy = items.slice();
        var i;

        for (i = copy.length - 1; i > 0; i -= 1) {
          var swapIndex = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[swapIndex];
          copy[swapIndex] = temp;
        }

        return copy;
      }

      function safeParse(node) {
        if (!node) {
          return [];
        }

        try {
          var parsed = JSON.parse(node.textContent.trim());
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function buildQueueDisk(person, index) {
        var button = document.createElement("button");
        var disk = document.createElement("div");
        var image = document.createElement("img");
        var name = document.createElement("div");

        button.className = "pb-plinko__disk-button";
        button.type = "button";
        button.dataset.index = String(index);
        button.setAttribute("aria-label", "Drop " + person.name);

        disk.className = "pb-plinko__disk";
        image.className = "pb-plinko__disk-image";
        name.className = "pb-plinko__disk-name";

        image.src = person.img || "";
        image.alt = person.name ? person.name + " portrait" : "Team member portrait";
        image.loading = "lazy";
        image.decoding = "async";
        name.textContent = person.name || "Team member";

        disk.appendChild(image);
        disk.appendChild(name);
        button.appendChild(disk);
        button.addEventListener("click", function () {
          dropPerson(person);
        });
        return button;
      }

      function updateControls() {
        if (dropButton) {
          dropButton.disabled = available.length === 0;
        }
      }

      function buildToken(person) {
        var token = document.createElement("div");
        var image = document.createElement("img");
        var name = document.createElement("div");

        token.className = "pb-plinko__token";
        token.style.setProperty("--pb-size", geometry.diskSize + "px");

        image.className = "pb-plinko__token-image";
        image.src = person.img || "";
        image.alt = person.name ? person.name + " portrait" : "Team member portrait";
        image.loading = "lazy";
        image.decoding = "async";

        name.className = "pb-plinko__disk-name";
        name.textContent = person.name || "Team member";

        token.appendChild(image);
        token.appendChild(name);
        disksLayer.appendChild(token);
        return token;
      }

      function computeGeometry() {
        var width = board.clientWidth;
        var slots = clamp(Math.round(width / 138), 5, 8);
        var slotWidth = width / slots;
        var baseHeight = board.clientHeight;
        var height = baseHeight;
        var diskSize = clamp(Math.min(width, height) * 0.1, 70, 98);
        var pegRadius = 7;
        var diskRadius = diskSize * 0.5;
        var pegSpacingX = clamp(diskSize * 1.28, 90, 138);
        var pegSpacingY = clamp(pegSpacingX * 0.94, 78, 124);
        var startY = 88;
        var slotDepth = Math.max(diskSize * 4.6, 320);
        var laneEntryGap = Math.max(diskSize * 1.5, pegSpacingY * 1.05);
        var rows = clamp(
          Math.floor((baseHeight - startY - slotDepth - laneEntryGap - 40) / pegSpacingY),
          5,
          8
        );
        var lastPegY = startY + (rows - 1) * pegSpacingY;
        var pegFieldBottom = lastPegY + pegRadius;
        var dividerTop = pegFieldBottom + laneEntryGap;
        var requiredHeight = pegFieldBottom + slotDepth + 20;

        if (requiredHeight > height) {
          height = requiredHeight;
        }

        var floorY = height - 20;
        var leftBound = diskRadius + 8;
        var rightBound = width - diskRadius - 8;
        var spawnX = width / 2;
        var spawnY = 34;
        var bins = [];
        var i;

        for (i = 0; i < slots; i += 1) {
          bins.push({
            left: i * slotWidth,
            right: (i + 1) * slotWidth,
            center: i * slotWidth + slotWidth / 2
          });
        }

        return {
          width: width,
          height: height,
          slots: slots,
          slotWidth: slotWidth,
          floorY: floorY,
          dividerTop: dividerTop,
          startY: startY,
          rows: rows,
          pegFieldBottom: pegFieldBottom,
          laneEntryGap: laneEntryGap,
          slotDepth: slotDepth,
          diskSize: diskSize,
          diskRadius: diskRadius,
          pegRadius: pegRadius,
          pegSpacingX: pegSpacingX,
          pegSpacingY: pegSpacingY,
          leftBound: leftBound,
          rightBound: rightBound,
          spawnX: spawnX,
          spawnY: spawnY,
          bins: bins
        };
      }

      function rebuildBoardScenery() {
        geometry = computeGeometry();
        board.style.minHeight = geometry.height + "px";
        pegs = [];
        dividers = [];
        pegsLayer.innerHTML = "";
        dividersLayer.innerHTML = "";
        slotsLayer.innerHTML = "";

        var sideMargin = Math.max(geometry.diskRadius + 14, geometry.pegSpacingX * 0.8);
        var evenColumns = Math.max(
          5,
          Math.floor((geometry.width - sideMargin * 2) / geometry.pegSpacingX)
        );
        var row;

        for (row = 0; row < geometry.rows; row += 1) {
          var rowColumns = row % 2 === 0 ? evenColumns : Math.max(4, evenColumns - 1);
          var rowWidth = (rowColumns - 1) * geometry.pegSpacingX;
          var x = geometry.width / 2 - rowWidth / 2;
          var y = geometry.startY + row * geometry.pegSpacingY;
          var placed = 0;

          while (placed < rowColumns) {
            var peg = { x: x, y: y, radius: geometry.pegRadius };
            var pegNode = document.createElement("div");

            pegNode.className = "pb-plinko__peg";
            pegNode.style.left = x + "px";
            pegNode.style.top = y + "px";
            pegsLayer.appendChild(pegNode);
            pegs.push(peg);
            x += geometry.pegSpacingX;
            placed += 1;
          }
        }

        geometry.bins.forEach(function (bin, index) {
          if (index > 0) {
            var divider = document.createElement("div");
            var dividerX = bin.left;

            divider.className = "pb-plinko__divider";
            divider.style.left = dividerX - 3 + "px";
            divider.style.height = geometry.height - geometry.dividerTop + "px";
            divider.style.top = geometry.dividerTop + "px";
            dividersLayer.appendChild(divider);
            dividers.push({
              x: dividerX,
              top: geometry.dividerTop,
              bottom: geometry.floorY,
              halfWidth: 6
            });
          }

          var slot = document.createElement("div");
          slot.className = "pb-plinko__slot";
          slot.style.left = bin.left + "px";
          slot.style.width = geometry.slotWidth + "px";
          slot.style.height = geometry.height - geometry.dividerTop + "px";
          slot.textContent = "Slot " + (index + 1);
          slotsLayer.appendChild(slot);
        });
      }

      function renderQueue() {
        queue.innerHTML = "";

        if (!available.length) {
          var empty = document.createElement("div");
          empty.className = "pb-plinko__queue-empty";
          empty.textContent = "All disks dropped. Hit reset to randomize and play again.";
          queue.appendChild(empty);
          updateControls();
          return;
        }

        available.forEach(function (person, index) {
          queue.appendChild(buildQueueDisk(person, index));
        });
        updateControls();
      }

      function findBinCenter(x) {
        var selected = geometry.bins[0];

        geometry.bins.forEach(function (bin) {
          if (x >= bin.left && x <= bin.right) {
            selected = bin;
          }
        });

        return selected.center;
      }

      function spawnDisk(person) {
        if (!geometry) {
          return;
        }

        var token = buildToken(person);
        var spawnSpread = geometry.slotWidth * 0.32;

        disks.push({
          person: person,
          element: token,
          x: geometry.spawnX + (Math.random() - 0.5) * spawnSpread,
          y: geometry.spawnY,
          vx: (Math.random() - 0.5) * 1.4,
          vy: 0,
          radius: geometry.diskRadius,
          settled: false,
          angle: 0,
          spin: (Math.random() - 0.5) * 0.08
        });
      }

      function dropPerson(person) {
        if (!person) {
          return false;
        }

        spawnDisk(person);
        available = available.filter(function (candidate) {
          return candidate !== person;
        });
        renderQueue();
        return true;
      }

      function queueAutoDrop() {
        if (autoDropTimer) {
          window.clearTimeout(autoDropTimer);
          autoDropTimer = 0;
        }

        if (!available.length) {
          updateControls();
          return;
        }

        autoDropTimer = window.setTimeout(function () {
          autoDropTimer = 0;
          dropPerson(available[0]);
          queueAutoDrop();
        }, 900);
      }

      function resolveDiskCollision(a, b) {
        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
        var minimum = a.radius + b.radius;

        if (distance >= minimum) {
          return;
        }

        var overlap = (minimum - distance) / distance;
        var pushX = dx * overlap * 0.5;
        var pushY = dy * overlap * 0.5;

        a.x -= pushX;
        a.y -= pushY;
        b.x += pushX;
        b.y += pushY;

        a.vx -= pushX * 0.05;
        a.vy -= pushY * 0.05;
        b.vx += pushX * 0.05;
        b.vy += pushY * 0.05;
      }

      function resolvePegCollision(disk, peg) {
        var dx = disk.x - peg.x;
        var dy = disk.y - peg.y;
        var distance = Math.sqrt(dx * dx + dy * dy) || 0.001;
        var minimum = disk.radius + peg.radius;

        if (distance >= minimum) {
          return;
        }

        var nx = dx / distance;
        var ny = dy / distance;
        var overlap = minimum - distance;
        var velocityAlongNormal = disk.vx * nx + disk.vy * ny;

        disk.x += nx * overlap;
        disk.y += ny * overlap;

        if (velocityAlongNormal < 0) {
          disk.vx -= 1.34 * velocityAlongNormal * nx;
          disk.vy -= 1.34 * velocityAlongNormal * ny;
          disk.vx += nx * 0.16;
        }
      }

      function resolveDividerCollision(disk, divider) {
        if (disk.y + disk.radius < divider.top || disk.y - disk.radius > divider.bottom) {
          return;
        }

        var dx = disk.x - divider.x;
        var reach = disk.radius + divider.halfWidth;

        if (Math.abs(dx) >= reach) {
          return;
        }

        var direction = dx < 0 ? -1 : 1;
        disk.x = divider.x + direction * reach;
        disk.vx *= -0.68;
      }

      function stepPhysics() {
        if (!geometry) {
          return;
        }

        var i;
        var j;
        var substeps = 2;
        var gravity = 0.22;

        for (j = 0; j < substeps; j += 1) {
          disks.forEach(function (disk) {
            if (disk.settled) {
              return;
            }

            disk.vy += gravity / substeps;
            disk.x += disk.vx / substeps;
            disk.y += disk.vy / substeps;
            disk.angle += disk.spin + disk.vx * 0.01;

            if (disk.x < geometry.leftBound) {
              disk.x = geometry.leftBound;
              disk.vx *= -0.72;
            } else if (disk.x > geometry.rightBound) {
              disk.x = geometry.rightBound;
              disk.vx *= -0.72;
            }

            if (disk.y - disk.radius < 6) {
              disk.y = disk.radius + 6;
              disk.vy *= -0.35;
            }
          });

          for (i = 0; i < disks.length; i += 1) {
            for (j = i + 1; j < disks.length; j += 1) {
              resolveDiskCollision(disks[i], disks[j]);
            }
          }

          disks.forEach(function (disk) {
            pegs.forEach(function (peg) {
              resolvePegCollision(disk, peg);
            });

            dividers.forEach(function (divider) {
              resolveDividerCollision(disk, divider);
            });

            if (disk.y + disk.radius >= geometry.floorY) {
              disk.y = geometry.floorY - disk.radius;
              disk.vy *= -0.42;
              disk.vx *= 0.98;

              if (Math.abs(disk.vy) < 0.3) {
                disk.vy = 0;
              }

              if (Math.abs(disk.vx) < 0.05 && Math.abs(disk.vy) === 0) {
                var center = findBinCenter(disk.x);
                disk.x += (center - disk.x) * 0.05;

                if (Math.abs(center - disk.x) < 0.6) {
                  disk.settled = true;
                  disk.vx = 0;
                  disk.spin *= 0.82;
                }
              }
            }
          });
        }
      }

      function renderDisks() {
        disks.forEach(function (disk) {
          disk.element.style.left = disk.x.toFixed(1) + "px";
          disk.element.style.top = disk.y.toFixed(1) + "px";
          disk.element.style.transform =
            "translate(-50%, -50%) rotate(" +
            disk.angle.toFixed(2) +
            "rad)";
        });
      }

      function frame() {
        stepPhysics();
        renderDisks();
        rafId = window.requestAnimationFrame(frame);
      }

      function resetGame() {
        if (autoDropTimer) {
          window.clearTimeout(autoDropTimer);
          autoDropTimer = 0;
        }

        available = shuffle(
          safeParse(dataNode).filter(function (person) {
            return person && person.name && person.img;
          })
        );
        disks.forEach(function (disk) {
          disk.element.remove();
        });
        disks = [];
        rebuildBoardScenery();
        renderQueue();
      }

      function init() {
        var people = safeParse(dataNode).filter(function (person) {
          return person && person.name && person.img;
        });

        if (!people.length || !board || !queue || !disksLayer) {
          return;
        }

        available = shuffle(people);
        rebuildBoardScenery();
        renderQueue();

        dropButton.addEventListener("click", function () {
          if (!available.length) {
            return;
          }

          dropPerson(available[0]);
          queueAutoDrop();
        });
        resetButton.addEventListener("click", resetGame);

        if ("ResizeObserver" in window) {
          resizeObserver = new ResizeObserver(function () {
            resetGame();
          });
          resizeObserver.observe(board);
        }

        rafId = window.requestAnimationFrame(frame);
        widget.dataset.pbPlinkoReady = "true";
      }

      init();
    })();
  </script>
</section>
